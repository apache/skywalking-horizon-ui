github:
  description: Apache SkyWalking next-generation UI (Horizon)
  homepage: https://skywalking.apache.org/
  labels:
    - skywalking
    - observability
    - apm
    - ui
    - vue
    - dashboard
    - tracing
    - metrics
    - logging
    - topology
  enabled_merge_buttons:
    squash:  true
    merge:   false
    rebase:  false
  dependabot_updates: false
  protected_branches:
    main:
      required_status_checks:
        # Require branches to be up to date with main before merging.
        strict: true
        # Two rolled-up statuses, one per workflow, so protection gates on
        # fixed context names rather than on matrix jobs whose names change
        # whenever a case is added or renamed.
        #
        #   Required      — ci.yaml: license headers, lint, type-check, unit
        #                   tests, packaging, and booting the artifact
        #   E2E Required  — e2e.yaml: every deployment case, against a real
        #                   OAP, verified in a headless browser
        contexts:
          - Required
          - E2E Required
      required_pull_request_reviews:
        required_approving_review_count: 1
        # Drop stale approvals when a PR gets new commits, so a reviewer's
        # LGTM doesn't carry over to code they haven't seen.
        dismiss_stale_reviews: true
