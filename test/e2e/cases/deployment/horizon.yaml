# Horizon inside the cluster, as the compose cases run it beside OAP.
#
# Identical in shape to the istio case's copy — kept per case rather than
# shared because the two differ in which OAP endpoints they need, and a
# shared template with per-case holes punched in it reads worse than two
# short manifests.
#
# __PLACEHOLDERS__ are substituted by script/prepare/deployment-up.sh from
# script/env, so the image tag and the e2e account have ONE definition shared
# with every other case.
#
# imagePullPolicy: Never — the image is built from this checkout and side-
# loaded into the node. A pull would silently test someone else's build, the
# same guarantee `pull_policy: never` gives the compose cases.

apiVersion: v1
kind: Service
metadata:
  name: horizon
  namespace: istio-system
  labels:
    app: horizon
spec:
  type: NodePort
  selector:
    app: horizon
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      # Fixed rather than allocated: the browser container builds its URL from
      # the same pin in script/env, so both ends agree without discovery.
      nodePort: __NODE_PORT__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon
  namespace: istio-system
  labels:
    app: horizon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: horizon
  template:
    metadata:
      labels:
        app: horizon
    spec:
      containers:
        - name: horizon
          image: __IMAGE__
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: HORIZON_OAP_QUERY_URL
              value: http://skywalking-oap.istio-system:12800
            - name: HORIZON_OAP_ADMIN_URL
              value: http://skywalking-oap.istio-system:17128
            # Stated explicitly because it is the contract under test: Horizon
            # seeds the bundle into OAP's ui_template store at boot and then
            # renders only what OAP holds.
            - name: HORIZON_TEMPLATES_MODE
              value: live
            - name: HORIZON_AUTH_BACKEND
              value: local
            - name: HORIZON_AUTH_LOCAL_USERS
              value: '__AUTH_USERS__'
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
