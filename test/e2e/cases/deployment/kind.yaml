# Single-node cluster for the deployment scenario.
#
# The node container joins docker's `kind` network, which is how the browser
# container reaches Horizon: it attaches to the same network and calls the
# NodePort on the node by container name. No host port mapping is involved, so
# a laptop run and a CI run address the fixture identically.
#
# The node image is written out in full rather than read from script/env: kind
# config files are handed to kind verbatim, with none of the ${VAR} expansion
# infra-e2e does elsewhere, so a reference here would be pulled literally.
# It carries its own digest, so the k8s version and the image serving it
# cannot drift apart.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.28.15@sha256:a7c05c7ae043a0b8c818f5a06188bc2c4098f6cb59ca7d1856df00375d839251
