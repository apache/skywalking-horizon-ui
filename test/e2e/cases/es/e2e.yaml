# ElasticSearch storage. Deliberately NOT a copy of `core`: re-asserting every
# signal on a second backend would double the runtime to re-prove things that
# do not depend on storage. This case exists for the branch that does — the
# pre-v2 trace query — plus enough of a smoke test to show the UI still works
# when the backend changes underneath it.
#
# Run it:  e2e run -c test/e2e/cases/es/e2e.yaml
# Images:  make -C test/e2e images

setup:
  env: compose
  file: docker-compose.yml
  timeout: 30m
  init-system-environment: ../../script/env
  steps:
    # Scope first, so a red run shows what this case covers before it shows
    # what broke. Read out of the case table in .github/workflows/e2e.yaml.
    - name: coverage
      command: bash test/e2e/script/prepare/echo-coverage.sh es
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash test/e2e/script/prepare/install.sh yq
    - name: install swctl
      command: bash test/e2e/script/prepare/install.sh swctl
    - name: prepare browser image
      command: bash test/e2e/script/prepare/install.sh playwright

trigger:
  action: http
  interval: 3s
  times: -1
  url: http://${consumer_host}:${consumer_9092}/users
  method: POST
  body: '{"id":"123","name":"skywalking"}'
  headers:
    "Content-Type": "application/json"

verify:
  retry:
    count: 40
    interval: 5s
  cases:
    # A readiness check, not a test (CLAUDE.md §3.3): OAP persists on a ~25s
    # cycle, so without this the wait lands on the browser case, which absorbs
    # it by retrying the whole project.
    - query: |
        swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql \
          metrics exec --expression=service_cpm --service-name=e2e-service-provider
      expected: expected/metrics-has-value.yml

    # The whole point of this deployment, asserted on screen. The traces tab
    # renders which OAP query answered, so the pre-v2 path is verifiable the
    # way an operator meets it — and the same assertion proves the storage
    # override took effect, since BanyanDB would report the v2 API here.
    #
    # Deliberately the ONLY verification: re-running the shell and layer
    # journeys on a second backend re-proves what storage does not affect.
    # READINESS: traces are queryable. service_cpm above proves metrics persisted,
    # which is a DIFFERENT write — on ElasticSearch a trace segment can lag
    # the metric it produced. The es project asserts only on traces, and
    # playwright.sh will not re-run it after a first failure, so the wait has
    # to happen here rather than inside the browser attempt.
    - query: |
        bash test/e2e/script/prepare/horizon-get.sh \
          "http://${horizon_host}:${horizon_8081}" /api/layer/general/traces \
          '{"windowMinutes":30,"pageSize":10,"source":"native"}' \
          | yq -P '{"hasTraces": ((.native.traces // []) | length > 0)}'
      expected: expected/has-traces.yml

    - query: |
        bash test/e2e/script/prepare/playwright.sh es
      expected: expected/passed.yml

cleanup:
  on: always
