# Core case: the whole stack on BanyanDB, with the Java demo app producing
# GENERAL-layer services, endpoints, traces and metrics.
#
# Every service comes from the shared base; this file adds only the ordering
# and the ports the verify cases need to reach. `extends` does not carry
# depends_on, which is why the chain is declared here rather than centrally.

services:
  banyandb:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: banyandb
    ports:
      - 17912

  oap:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: oap
    ports:
      - 12800
      - 17128
    depends_on:
      banyandb:
        condition: service_healthy

  provider:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: provider
    ports:
      - 9090
    depends_on:
      oap:
        condition: service_healthy

  consumer:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: consumer
    ports:
      # Published so the `trigger` block can drive the demo app from the host.
      - 9092
    depends_on:
      provider:
        condition: service_healthy

  # The audit log's backing store. Only this case runs it: sign-in recording
  # is off by default everywhere else, and this is the case that performs a
  # real sign-in through the real form.
  audit-db:
    image: "postgres:16-alpine"
    networks: [e2e]
    expose: ["5432"]
    environment:
      POSTGRES_USER: horizon
      POSTGRES_DB: horizon
      # Container-internal, on an isolated compose network, holding only what
      # this run writes. `trust` keeps a throwaway password out of the file.
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon -d horizon"]
      interval: 3s
      timeout: 5s
      retries: 30

  horizon:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: horizon
    ports:
      - 8081
    environment:
      # Recording is off by default, so the case that exercises a sign-in
      # turns it on explicitly.
      HORIZON_AUDIT_ENABLED: "true"
      HORIZON_AUDIT_PROVIDER: postgres
      # `allowCleartext` because this database is a container on an isolated
      # compose network that exists for the length of one run. A non-loopback
      # host is otherwise refused at boot, which is the correct default and is
      # what this fixture would trip over first.
      HORIZON_AUDIT_POSTGRES: '{"url":"postgres://horizon@audit-db:5432/horizon","allowCleartext":true}'
      # Compressed from the shipped 50 rows / 15s / 60s. The defaults are what
      # the unit tests cover; here the point is that a sign-in REACHES the
      # table, and a suite that waited a minute per assertion to prove it
      # would be paying for the timer rather than the behaviour.
      HORIZON_AUDIT_EVENT_BATCH_SECONDS: "2"
      HORIZON_AUDIT_FLUSH_INTERVAL_SECONDS: "4"
      # API-token credential, so the same case covers the aggregated path.
      HORIZON_AUTH_TOKENS_FILE: /horizon/tokens.json
    volumes:
      - ../../script/docker-compose/e2e-tokens.json:/horizon/tokens.json:ro
    depends_on:
      oap:
        condition: service_healthy
      audit-db:
        condition: service_healthy

networks:
  e2e:
