# Traffic runs INSIDE the cluster rather than from infra-e2e's `trigger`.
#
# kind has no load balancer, so the ingress gateway has no address a host-side
# trigger could call. A pod calling the gateway by cluster DNS is both simpler
# and closer to how the mesh is actually used.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: trafficgenerator
  namespace: default
  labels:
    app: trafficgenerator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trafficgenerator
  template:
    metadata:
      labels:
        app: trafficgenerator
      annotations:
        # Unmeshed on purpose: a sidecar here would add the generator itself
        # to the topology the specs assert on.
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: trafficgenerator
          # Side-loaded by import-images; pinned in script/env.
          image: alpine/curl:8.9.1
          command: ["/bin/sh", "-c", "--"]
          args:
            - |
              while true; do
                curl -s -o /dev/null http://istio-ingressgateway.istio-system:80/productpage
                sleep 1
              done
          resources:
            requests:
              cpu: 0.1
