# ─────────────────────────────────────────────────────────────────────
# This is the SHIPPED default config. EVERY field below is an env var:
# `${HORIZON_X:default}` expands BEFORE YAML parsing. So you can run the
# container with NO mounted file and set only the env vars you care about
# (image-native), OR copy this to `horizon.yaml`, edit, and mount it.
#
#   • String scalars are quoted (`"${X:default}"`) so a value with YAML
#     metacharacters (`:`, `#`, …) can't break parsing.
#   • Numbers / booleans are unquoted so they keep their type.
#   • Lists / objects (users, ldap, roles, excluded, performance, oap.auth)
#     are UNQUOTED and take a JSON STRING env var — injected inline + parsed.
#     A `:null` default means "fall through to the built-in default".
#   • Precedence: env var > this file's `:default` > built-in schema default.
#   • Secrets (password hashes, ldap bind pw) are env-only — never bake them.
#
# Hot-reload picks up file edits; env vars are fixed at process start.
# ─────────────────────────────────────────────────────────────────────

server:
  # Bind host/port. The image sets HORIZON_SERVER_HOST=0.0.0.0 so the BFF
  # is reachable from outside the container (the YAML default 127.0.0.1
  # would bind container-loopback only).
  host: "${HORIZON_SERVER_HOST:127.0.0.1}"
  port: ${HORIZON_SERVER_PORT:8081}
  # The PUBLIC base URL operators reach this Horizon at, e.g.
  # https://horizon.example.com. Used by single sign-on to build its callback
  # and by the OAuth authorization server as its issuer. Blank derives it from
  # each request, which is right for a plain deployment and wrong behind a
  # proxy that rewrites Host — and in dev, where Vite proxies /api so the BFF
  # sees :8081 while you are browsing :9091.
  publicUrl: "${HORIZON_PUBLIC_URL:}"
  # Believe X-Forwarded-For for the client address? `false` records the direct
  # peer, which behind a proxy is the proxy — every audit row would name the
  # ingress. `true` is REFUSED at boot: it trusts the whole header, so any
  # caller could choose the address recorded. Use a hop count (1 = one proxy in
  # front) or the ingress address/CIDR, which cannot be over-counted.
  # Restart-only.
  trustProxy: ${HORIZON_TRUST_PROXY:false}


templates:
  # `live` (default): seed/read/write templates through OAP 11's
  # /ui-management/templates* REST API and persist them in OAP storage.
  # In this mode OAP is the ONLY source — if its template store cannot be
  # read, layer pages are blocked rather than falling back to the bundle.
  # `readonly`: render templates from the local bundle only — the
  # template-management API is never called and the whole config surface
  # is read-only. OAP 10 has legacy GraphQL template management, but Horizon
  # does not consume it, so OAP 10 requires `readonly`. OAP's query API is
  # still used either way. (Changing this mode needs a BFF restart.)
  mode: "${HORIZON_TEMPLATES_MODE:live}"

security:
  # Hosts a dashboard template's outbound link may point at. The only
  # operator-supplied link in the product is a layer template's
  # `documentLink` — the "docs ↗" anchor in the layer header — and it may
  # only leave this origin for a host listed here. A host matches itself and
  # its subdomains.
  #
  # The default is the project's own documentation domain, because every
  # bundled layer template links there. It is a default, not a built-in
  # exemption: set this to `[]` for a fully closed console and no outbound
  # link renders at all. Add your internal wiki to keep its links working.
  #
  # A site-relative link (`/runbook/kafka`) never needs listing — it does not
  # leave the origin. Non-http(s) schemes (`javascript:`, `data:`, …) are
  # always refused and that is not configurable.
  trustedLinkDomains: ${HORIZON_TRUSTED_LINK_DOMAINS:["skywalking.apache.org"]}

oap:
  # OAP query host (GraphQL + /status/*; default port 12800).
  queryUrl: "${HORIZON_OAP_QUERY_URL:http://127.0.0.1:12800}"
  # OAP admin host (runtime-rule / dsl-debugging / inspect / status;
  # default port 17128). Point at a DNS name / VIP fronting the cluster.
  adminUrl: "${HORIZON_OAP_ADMIN_URL:http://127.0.0.1:17128}"
  # OAP Zipkin v2 REST host. Use `<queryUrl>/zipkin` when OAP shares the
  # GraphQL port (typical for the demo / k8s deploys).
  zipkinUrl: "${HORIZON_OAP_ZIPKIN_URL:http://127.0.0.1:9412/zipkin}"
  timeoutMs: ${HORIZON_OAP_TIMEOUT_MS:15000}
  # Optional MQE host/port override (defaults to the query host). JSON env, e.g.
  # HORIZON_OAP_MQE='{"host":"mqe.internal","port":12800}'.
  mqe: ${HORIZON_OAP_MQE:null}
  # Optional basic-auth for outbound OAP calls. JSON env, e.g.
  # HORIZON_OAP_AUTH='{"username":"skywalking","password":"skywalking"}'.
  auth: ${HORIZON_OAP_AUTH:null}

# Layers hidden from the sidebar even when OAP reports them. JSON array of
# {key, reason}; `:null` keeps the built-in default (FAAS, VIRTUAL_GATEWAY).
# HORIZON_LAYERS_EXCLUDED='[]' surfaces every reported layer.
layers:
  excluded: ${HORIZON_LAYERS_EXCLUDED:null}

# ─────────────────────────────────────────────────────────────────────
# Authentication. Pick ONE backend: `local` or `ldap`. With `local` and no
# users (or `ldap` with no group mappings) the BFF boots but no login
# succeeds until configured — there is no default admin/admin.
# Generate password hashes with:  pnpm --filter bff cli:hash
# ─────────────────────────────────────────────────────────────────────
auth:
  backend: "${HORIZON_AUTH_BACKEND:local}"
  # Local users — JSON array, e.g.
  # HORIZON_AUTH_LOCAL_USERS='[{"username":"admin","passwordHash":"$argon2id$v=19$...","roles":["admin"]}]'
  local:
    users: ${HORIZON_AUTH_LOCAL_USERS:[]}
  # LDAP block (required when backend=ldap) — JSON object, e.g.
  # HORIZON_AUTH_LDAP='{"url":"ldaps://ldap.corp:636","userBaseDn":"ou=people,dc=corp","groupMappings":[{"group":"*","role":"viewer"}]}'
  ldap: ${HORIZON_AUTH_LDAP:null}
  # Break-glass admin, honored ONLY when backend=ldap AND the LDAP probe is
  # failing; every use is logged at WARN. JSON object or null.
  breakGlass: ${HORIZON_AUTH_BREAK_GLASS:null}
  # Single sign-on. Horizon acts as a CLIENT here — it sends the operator out to
  # an identity provider. The `oauth:` block further down points the other way:
  # Horizon as the SERVER, issuing tokens to MCP clients.
  #
  # Named `sso` for the capability, not for a protocol, because it carries both:
  # `kind: oidc` verifies a signed ID token, `kind: oauth2` reads an address
  # from a userinfo call for the providers that never adopted OIDC. Calling the
  # block `oidc` while it held oauth2 providers was a contradiction on its face.
  #
  # ADDITIVE to `backend` above — password login keeps working, so a broken
  # provider never locks you out of your own observability.
  #
  # Every provider is the same three fields, because everything vendor-specific
  # is read from `<issuer>/.well-known/openid-configuration` at runtime. There
  # is ONE callback for all of them — register
  # `<your-horizon>/api/auth/oidc/callback` with each provider.
  #
  # The block has TWO parts, and the split is load-bearing:
  #   providers — HOW someone proves who they are (endpoints, client id/secret,
  #               and `allowedDomains`: who may sign in through this one).
  #   roles     — WHAT they may then do. ONE table for every provider.
  #
  # Roles are not per-provider, and that is a correctness constraint. They are
  # re-resolved on every request from a username and nothing else — which is
  # what stops a token outliving its owner's access — and at that moment there
  # is no record of which provider authenticated it. A per-provider table could
  # therefore never be honoured for a token.
  #
  # HORIZON_AUTH_SSO='{
  #   "providers":[{"id":"google","displayName":"Google",
  #     "issuer":"https://accounts.google.com","clientId":"...","clientSecret":"...",
  #     "allowedDomains":["example.com"]}],
  #   "roles":{"defaultRoles":["viewer"],"roleByEmail":{"boss@example.com":["admin"]}}}'
  #
  # Buttons show the provider's displayName as TEXT. Horizon ships no vendor
  # logos — Google, GitLab and Okta each require prior written permission, and
  # no provider's terms says whether the asset may be redistributed in a
  # release at all. Supply your own with `"icon":"data:image/svg+xml;base64,…"`.
  #
  # A provider that never adopted OIDC (GitHub, Gitee) takes `"kind":"oauth2"`
  # plus authorizationEndpoint / tokenEndpoint / userinfoEndpoint and an
  # `emailPath` saying where the address sits in ITS response. Weaker: identity
  # is a userinfo call, not a verified signature — and it needs the provider to
  # return an EMAIL. WeChat returns only openid/unionid and a profile, so no
  # configuration fits it; front it with Authing or Casdoor instead. See
  # docs/setup/auth.md for the per-provider table.
  #
  # An external provider says WHO you are, never what you may do here: roles
  # default to `viewer` and are mapped from the email address in `roles`, which
  # every provider shares. Most specific wins — an exact address beats its
  # domain, which beats the default.
  #
  # `allowedDomains` matches the address the PROVIDER reports — for Google that
  # is the Google account's own address, not a domain that merely forwards mail
  # to it. Empty admits anyone with an account there: wrong for an internal
  # deployment, right for a public demo where every visitor is a viewer anyway
  # and a real identity in the server log beats a shared login.
  sso: ${HORIZON_AUTH_SSO:null}
  # API tokens for callers with no browser — scripts, CI, MCP clients. A PATH,
  # because this file is committed and holds no secrets: point it at a mounted
  # Secret. Mint entries with `pnpm --filter bff cli:token <username>`. A token
  # names a user and roles resolve from that user per request, so it can never
  # exceed their access. Empty disables token auth.
  tokensFile: "${HORIZON_AUTH_TOKENS_FILE:}"

# RBAC. `roles` maps a role → its verb grants; `landingByRole` is the
# post-login landing route per role. `:null` keeps the built-in defaults
# (viewer/maintainer/operator/admin). Override with a JSON object env var.
rbac:
  enabled: ${HORIZON_RBAC_ENABLED:true}
  roles: ${HORIZON_RBAC_ROLES:null}
  landingByRole: ${HORIZON_RBAC_LANDING_BY_ROLE:null}

session:
  ttlMinutes: ${HORIZON_SESSION_TTL_MINUTES:60}
  cookieName: "${HORIZON_SESSION_COOKIE_NAME:horizon_sid}"
  cookieSecure: ${HORIZON_SESSION_COOKIE_SECURE:false}   # set true behind HTTPS

debugLog:
  enabled: ${HORIZON_DEBUG_LOG_ENABLED:false}
  file: "${HORIZON_WIRE_LOG_FILE:./horizon-wire.jsonl}"
  maxBodyChars: ${HORIZON_DEBUG_LOG_MAX_BODY_CHARS:8192}
  redactAuthHeaders: ${HORIZON_DEBUG_LOG_REDACT_AUTH:true}
query:
  # Max services a layer landing runs metric MQE for, per request.
  landingServiceCap: ${HORIZON_QUERY_LANDING_SERVICE_CAP:100}
  # N for the Overview KPI tiles' self-aggregating `top_n(...)` MQE.
  overviewTopN: ${HORIZON_QUERY_OVERVIEW_TOPN:100}

# JS source maps for the BROWSER-layer "Browser Errors" tab (#6784). Held
# in BFF process memory only (no OAP storage), per-instance + ephemeral.
# Drop durable .map files into `bootMountDir` (the image sets it to
# /app/sourcemaps).
sourceMaps:
  enabled: ${HORIZON_SOURCEMAPS_ENABLED:true}
  maxFileBytes: ${HORIZON_SOURCEMAPS_MAX_FILE_BYTES:67108864}      # 64 MiB
  maxTotalBytes: ${HORIZON_SOURCEMAPS_MAX_TOTAL_BYTES:536870912}   # 512 MiB
  maxFileCount: ${HORIZON_SOURCEMAPS_MAX_FILE_COUNT:128}
  bootMountDir: "${HORIZON_SOURCEMAPS_DIR:}"

# AI assistant (chat/LLM). OFF by default. Transport is pluggable + vendor-neutral:
#   • openai-compatible (default) — any OpenAI-shaped endpoint via `baseUrl`:
#     OpenAI, DeepSeek-direct, local models, AI gateways, Azure-OpenAI, or Claude
#     behind a gateway. Just set model + baseUrl + apiKey.
#   • bedrock — Amazon Bedrock Converse: model = a Bedrock model / inference-profile
#     id (e.g. deepseek.v3.2, us.anthropic.claude-...), apiKey = the Bedrock bearer
#     key (ABSK…); region falls back to AWS_REGION / AWS_DEFAULT_REGION when blank.
# Set `provider` only for a non-OpenAI-shaped service (bedrock). The api key is a
# SECRET — env-only, never bake it into this file. Inference params (temperature,
# output caps) are owned by the gateway/provider — not exposed here.
ai:
  enabled: ${HORIZON_AI_ENABLED:false}
  provider: "${HORIZON_AI_PROVIDER:openai-compatible}"
  model: "${HORIZON_AI_MODEL:}"
  baseUrl: "${HORIZON_AI_BASE_URL:}"                # openai-compatible
  region: "${HORIZON_AI_REGION:}"                   # bedrock only; blank → AWS_REGION/AWS_DEFAULT_REGION env
  apiKey: "${HORIZON_AI_API_KEY:}"                  # SECRET — env-only, never commit
  # Prompt overrides — blank = use the bundled defaults. For a multi-line system
  # prompt, replace the value with a YAML block scalar ( |- ). starters: JSON array.
  systemPrompt: "${HORIZON_AI_SYSTEM_PROMPT:}"
  starters: ${HORIZON_AI_STARTERS:null}
  # Client-side chat-history cap (MB); browser IndexedDB, per user.
  history:
    maxMb: ${HORIZON_AI_HISTORY_MAX_MB:500}

# MCP — let external agents (Claude Code, Codex, Claude Desktop, …) read this
# Horizon over the Model Context Protocol, at POST /api/mcp. Independent of the
# `ai:` block above: that one configures the model Horizon talks to for its own
# assistant, this one leaves the model on the caller's side.
#
# ON by default. The endpoint needs the same login as every other route (an API
# token from `auth.tokensFile`, or a browser session), is gated by the
# `mcp:read` verb, and each tool re-checks its own read verb — an agent sees
# exactly what the operator it authenticated as sees.
mcp:
  enabled: ${HORIZON_MCP_ENABLED:true}
  # What this deployment calls itself to an agent. An operator watching
  # production and staging connects BOTH, and without a name every Horizon
  # introduces itself identically — so an answer does not say which system it
  # came from. Blank uses the host of `server.publicUrl`.
  name: "${HORIZON_MCP_NAME:}"

# OAuth — Horizon ISSUING tokens. The OPPOSITE DIRECTION from `auth.sso`
# above, and the two are easy to confuse because both speak OAuth:
#
#   auth.sso   Horizon is the CLIENT — it sends YOU to Google to log in.
#   oauth      Horizon is an OAuth SERVER — it issues tokens to CLAUDE CODE.
#
# Independent switches; either works without the other. Turning this on lets an
# MCP client send its operator through a browser login instead of being handed a
# token out of band. The login page it renders is Horizon's own — so if
# `auth.sso` is also configured, that page offers Google, and the MCP client
# never learns Google was involved.
#
# OFF by default, and the only part of MCP that is: dynamic client registration
# is unauthenticated by spec, and issued tokens outlive browser sessions. On an
# internal deployment reached only from Claude Code or Codex, an API token in
# `auth.tokensFile` may be all anyone needs.
#
#   issuer     the PUBLIC base URL clients reach Horizon at. Defaults to
#              `server.publicUrl`; set it here only to advertise an issuer that
#              differs from it. Never derived from the Host header, because
#              discovery tells a client where to send its user to log in.
#   signingKey SECRET, env-only. Rotating it invalidates every outstanding
#              token and client registration at once.
oauth:
  enabled: ${HORIZON_OAUTH_ENABLED:false}
  issuer: "${HORIZON_OAUTH_ISSUER:}"
  signingKey: "${HORIZON_OAUTH_SIGNING_KEY:}"
  accessTokenMinutes: ${HORIZON_OAUTH_ACCESS_TOKEN_MINUTES:60}
  refreshTokenDays: ${HORIZON_OAUTH_REFRESH_TOKEN_DAYS:30}
  # A client may identify by URL instead of registering — Claude Code does —
  # which means this server fetches a URL an unauthenticated caller chose.
  # Every such fetch is https-only, refused for any non-public resolved address,
  # un-redirected, bounded and timed out. Empty means any public host; a list
  # confines it further, e.g. ["claude.ai"].
  clientMetadataHosts: ${HORIZON_OAUTH_CLIENT_METADATA_HOSTS:[]}

# Login audit — an optional, durable record of who signed in. OFF by default.
#
# Postgres or nothing: there is deliberately no file backend, because a file
# per pod is a partial history per replica with nothing to merge them.
#
# Only what a VALID credential produced is recorded — successes, plus the two
# refusals that happen AFTER authentication succeeds (no roles, no group
# mappings). Everything an anonymous caller can trigger stays in the
# application log, which is what keeps this table unreachable by someone with
# no credential.
audit:
  enabled: ${HORIZON_AUDIT_ENABLED:false}
  # Per Horizon node, per UTC hour. A safety valve, not a throttle: a
  # fifty-person team produces on the order of a hundred rows a DAY.
  maxRowsPerHour: ${HORIZON_AUDIT_MAX_ROWS_PER_HOUR:1000}
  # How often accumulated token-use counts and statistics are written. The
  # service runs ONE timer, at eventBatchSeconds below; this cadence is a
  # multiple of it rather than a second timer.
  flushIntervalSeconds: ${HORIZON_AUDIT_FLUSH_INTERVAL_SECONDS:60}
  # Sign-in rows are buffered and written in batches, never on the request
  # path — so a database cannot delay a login at all. Whichever trigger fires
  # first starts a flush; one pass writes a bounded number of batches and the
  # rest goes on the next. While the database is unreachable the buffer grows
  # instead, to a 10,000-row ceiling, and that is what a crash can lose.
  eventBatchRows: ${HORIZON_AUDIT_EVENT_BATCH_ROWS:50}
  eventBatchSeconds: ${HORIZON_AUDIT_EVENT_BATCH_SECONDS:15}
  provider: "${HORIZON_AUDIT_PROVIDER:none}"   # none | postgres | banyandb
  # SECRET — supply as JSON via the env var, never commit a connection string.
  # A non-loopback url must ask for sslmode=verify-full (or verify-ca): the
  # records carry usernames, email addresses and source addresses. Set
  # "allowCleartext": true to accept an unencrypted connection to a database
  # on a network you control (an in-cluster Postgres) — it is refused
  # otherwise, and turning it on warns at every boot.
  postgres: ${HORIZON_AUDIT_POSTGRES:null}
  # SECRET — same shape and the same reason: supply as JSON via the env var.
  # BanyanDB expires whole segments itself, so retention here is the group's
  # TTL in days and nothing sweeps. Two deployments sharing one BanyanDB must
  # set different `namespace` values, or they share one audit log.
  #
  #   {"address":"banyandb:17912","tls":true,"caFile":"/etc/horizon/bdb-ca.crt",
  #    "namespace":"prod","retentionDays":90}
  #
  # A non-loopback address without TLS is refused: the records carry usernames,
  # email addresses and source addresses, and the credentials travel as plain
  # gRPC metadata. Set "allowCleartext": true for a network you control.
  #
  # Connectivity, security, a namespace prefix and retention are the whole
  # surface. The groups' layout is bundled — one shard, which a sign-in rate
  # never outgrows, and which BanyanDB fixes at creation and does not reshard.
  banyandb: ${HORIZON_AUDIT_BANYANDB:null}

# Performance / behavior tuning — BFF→OAP fan-out + storage-protective caps.
# Operational, hot-reloaded. `:null` keeps the built-in defaults (shown in
# the docs); override the whole tree with a JSON object env var, e.g.
# HORIZON_PERFORMANCE='{"bulk":{"dashboard":{"bulkSize":8}}}'.
performance: ${HORIZON_PERFORMANCE:null}
