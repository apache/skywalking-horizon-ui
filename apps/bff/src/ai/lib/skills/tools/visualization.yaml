# LLM-facing tool manifest for the `visualization` skill: each tool's description +
# per-param hints the model reads to pick and call the tool. Edit the prompt text
# HERE, not in skill/visualization/tools.ts (which reads these via toolPrompt). These
# strings are part of the provider prompt-cache prefix — keep them byte-stable.

show_figure:
  description: >-
    CAPTURE a figure from a raw MQE expression and return it to you. This is the FALLBACK for a DERIVED query that has no catalog widget (a drilled child scope, a metric you composed); for a metric that IS in the catalog use show_widget instead, which brings the template's full config. Provide the layer, the service name, the MQE expression(s) — catalog MQE verbatim — and the `type` the expression's shape calls for. Pass instance/endpoint to read at that finer scope. Give several related figures the same group label to cluster them.
  params:
    type: >-
      Which figure the MQE's SHAPE calls for, not a style choice. `card` ONLY when the expression collapses the window to a single scalar (latest / max / min / avg of a plain metric / sum of a plain metric) — a scalar drawn as a line is one point and misleads. `line` for a time series (a plain metric, or rate / increase / relabels / histogram* / top_n over time). `top` for a sorted top-N list, an MQE wrapped in top_n(...). `table` for a labeled metric, e.g. latest(...) of a labeled metric, one row per label combination. `record` for RECORD-typed rows such as sampled records or slow-statement lists, top_n(top_n_<record>, N, order).
    title: >-
      Human title shown above the figure
    layer: >-
      OAP layer key, e.g. GENERAL
    service: >-
      Service NAME (from list_services)
    expressions: >-
      MQE expression(s) — use catalog MQE verbatim
    labels: >-
      One short human label PER expression. REQUIRED when you pass 2+ expressions on one chart (e.g. ["read","write"]) — without it every line inherits the title and the operator cannot tell them apart. Omit for a single expression.
    instance: >-
      ServiceInstance name → renders at instance scope
    endpoint: >-
      Endpoint name → renders at endpoint scope
    unit: >-
      Unit suffix, e.g. ms, %, cpm
    group: >-
      Optional group label. Give several related figures the SAME group to cluster them into ONE tabbed block (e.g. an entity breakdown); omit for a standalone figure.

show_widget:
  description: >-
    PREFERRED way to read a catalog metric: CAPTURE an EXISTING dashboard widget by its id with the template's FULL config (explanation/tip, unit, format, thresholds, per-rank legends) — identical to the dashboard, no reconstruction. Pass the layer, the scope you browsed, the service NAME, and the widgetId from kb_browse_catalog. Add instance/endpoint (a NAME) for a finer scope. Use show_figure ONLY for a DERIVED MQE with no catalog widget (e.g. a drilled child-scope query).
  params:
    layer: >-
      OAP layer key, e.g. GENERAL
    scope: >-
      the catalog scope you browsed (default service)
    service: >-
      service NAME
    widgetId: >-
      the widgetId from kb_browse_catalog
    instance: >-
      ServiceInstance NAME (instance scope)
    endpoint: >-
      Endpoint NAME (endpoint scope)
    group: >-
      cluster related figures into one tabbed block

show_hierarchy:
  description: >-
    CAPTURE a service's CROSS-LAYER hierarchy (the topology page's Smartscape overlay): the focused service plus the same logical service projected into its upper layers (e.g. a GENERAL service's MESH / K8S_SERVICE mirrors) and lower layers (backing infrastructure). Use this to show how one service maps across layers — NOT for same-layer dependencies (use show_topology for those). Provide the layer and service name.
  params:
    layer: >-
      OAP layer key of the focused service, e.g. GENERAL
    service: >-
      service NAME (from list_services)
    title: >-
      optional heading for the block

show_topology:
  description: >-
    CAPTURE a FOCUSED dependency topology (the ego graph): the seed service(s)
    plus what calls them and what they call. Seed it with ONE service, or with
    SEVERAL at once via `services` — two services that call each other belong in
    one graph, not in two ego graphs that repeat the edge between them. `depth`
    is how many hops out to walk, and it defaults to 2 because you named the
    services: one hop only adds who they directly touch, which is the answer you
    started with, and the second is where the rest of the path appears. Drop to 1
    for just the immediate neighbours, raise to 3 to follow a chain further, and
    expect the graph to grow fast. For the WHOLE
    layer use show_layer_topology instead — this one always centres on a seed.
    `windowMinutes` and `step` set the window the metrics on the nodes and edges
    are read over.
  params:
    layer: OAP layer key, e.g. GENERAL
    service: one service NAME to centre on (use `services` for several)
    services: several service NAMES to seed the same graph with; the first is the one the block centres on
    depth: hops to walk out from the seeds — 2 by default, 1 for immediate neighbours only, up to 3
    title: optional heading for the captured block

show_layer_topology:
  description: >-
    CAPTURE the WHOLE layer's dependency map in one call: every service OAP knows
    in that layer, plus every call between them, with their metric values. Use it
    for "what does this layer look like" or "show me the topology of <layer>" —
    any question about the shape of a system rather than about one service. It is
    NOT show_topology with the service left out: that one always centres on a
    seed, and walking a layer service-by-service repeats the same edges and never
    says how many services there are. It walks ONE hop and needs no more: every
    service in the layer is already a seed, so a further hop can only pull in
    inferred peers outside it. `windowMinutes` and `step` set the window the node
    and edge metrics are read over.
  params:
    layer: OAP layer key, e.g. GENERAL
    title: optional heading for the captured block

show_deployment:
  description: >-
    CAPTURE the per-service DEPLOYMENT view (read-only): the instance-to-instance call graph WITHIN one service (its instances/pods and the intra-service relations between them), the same view as the layer Deployment tab. Use it to show how a service's own instances talk to each other — NOT the cross-service topology (use show_topology for that). NOTE: it reads the SAME OAP instance-relation API as show_instance_topology, but with the one service on BOTH sides — so despite the shared backend it is a DIFFERENT concept: the service's own internal deployment / cluster-node graph, not a cross-service edge. Provide the layer and service name.
  params:
    layer: >-
      OAP layer key, e.g. GENERAL
    service: >-
      service NAME (from list_services)
    title: >-
      optional heading for the block

show_instance_topology:
  description: >-
    CAPTURE the per-PAIR INSTANCE-TOPOLOGY view (read-only): the instances of a SOURCE (client) service and a DEST (server) service as two columns, with the instance-to-instance calls BETWEEN them (the same instance-map drill-down the Topology tab opens from a call edge). Requires BOTH a source and a dest service that have a call relationship (source calls dest) — use it to show how one service's instances talk to another's. It reads the SAME OAP instance-relation API as show_deployment, but between TWO DIFFERENT services — a CROSS-service instance relationship, a different concept from a service's own deployment graph (show_deployment = one service's OWN instances; show_topology = service-level one-hop). Provide the layer, the source (client) service name, and the dest (server) service name.
  params:
    layer: >-
      OAP layer key, e.g. GENERAL
    sourceService: >-
      SOURCE (client) service NAME — the caller (from list_services)
    destService: >-
      DEST (server) service NAME — the callee it calls (from list_services)
    title: >-
      optional heading for the block

show_endpoint_dependency:
  description: >-
    CAPTURE one ENDPOINT's up/downstream dependency chain across services —
    which endpoints call it and which it calls (endpoint→endpoint, server-side
    only). Name the `endpoint` to pin the chain to that one; leave it out and the
    service's busiest endpoint is used, with the captured response recording
    which was drawn. It reads EndpointRelation, which comes from NATIVE
    SkyWalking tracing — on a Zipkin or mesh layer there are no endpoint
    relations and the chain is empty, so check the trace source in
    kb_layer_capabilities before reaching for it. `windowMinutes` and `step` set
    the window. Contrast show_topology (service-level) and show_deployment (one
    service's own instances).
  params:
    layer: OAP layer key, e.g. GENERAL
    service: the service NAME that owns the endpoint
    endpoint: the endpoint NAME to pin the chain to; omit for the busiest one
    title: optional heading for the captured block

show_traces:
  description: >-
    CAPTURE the native distributed-tracing view for a service — the real trace LIST plus the span WATERFALL, which the operator browses (click a trace to open its spans). Use it to surface slow / erroring traces for a service so a human can inspect them; there is no tool to read individual span data yourself. The captured list is frozen over the current chat time range. Provide the layer and service name. ONLY for a layer whose traces run NATIVE (SkyWalking segments) — for a Zipkin-tracing layer use list_zipkin_services + show_zipkin_traces instead.
  params:
    layer: >-
      OAP layer key, e.g. GENERAL
    service: >-
      service NAME (from list_services)
    title: >-
      optional heading for the block

list_zipkin_services:
  description: >-
    List the ZIPKIN service names (the span localEndpoint.serviceName universe — GLOBAL, not per-layer, and DIFFERENT from the SkyWalking service names). Use this for a Zipkin-tracing layer to find the Zipkin-side service name that matches the SkyWalking service (or the user's phrasing), THEN pass the matched name to show_zipkin_traces. Optionally pass a keyword to narrow the list.
  params:
    keyword: >-
      case-insensitive substring to narrow the Zipkin service list

show_zipkin_traces:
  description: >-
    CAPTURE the Zipkin distributed-tracing view — the real trace LIST + span WATERFALL for a ZIPKIN service, which the operator browses. `service` MUST be a Zipkin service name from list_zipkin_services (NOT the SkyWalking name — they differ). Use this for a layer whose traces run on Zipkin (Envoy ALS / rover) after matching the service. The captured list is frozen over the current chat time range. Provide the layer (for context) and the matched Zipkin service name.
  params:
    layer: >-
      OAP layer key, e.g. MESH
    service: >-
      ZIPKIN service name (from list_zipkin_services)
    title: >-
      optional heading for the block

show_logs:
  description: >-
    CAPTURE the layer LOGS view for a service — the real log stream the operator browses (click a row for its detail). Use it to surface a service's logs for a human to read. This is the layer Logs tab (stored logs); it is NOT fetch_pod_logs (that is the Kubernetes on-demand live tail). The captured stream (up to 100 rows) is frozen over the current chat time range. Provide the layer and service name.
  params:
    layer: >-
      OAP layer key, e.g. GENERAL
    service: >-
      service NAME (from list_services)
    title: >-
      optional heading for the block

show_browser_logs:
  description: >-
    CAPTURE the browser-monitoring ERROR list for a browser app — the client-side JS error stream the operator browses (click a row for its stack trace). Use it for a BROWSER-family layer's app to surface front-end errors for a human. The captured list (up to 100 rows) is frozen over the current chat time range. Provide the layer and service (browser-app) name.
  params:
    layer: >-
      OAP browser-layer key
    service: >-
      browser-app service NAME (from list_services)
    title: >-
      optional heading for the block
