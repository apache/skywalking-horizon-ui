# LLM-facing tool manifest for the `rca` skill: each tool's description +
# per-param hints the model reads to pick and call the tool. Edit the prompt text
# HERE, not in skill/rca/tools.ts (which reads these via toolPrompt). These
# strings are part of the provider prompt-cache prefix — keep them byte-stable.

list_playbooks:
  description: >-
    List the available root-cause investigation playbooks (id + title + when-to-use). Call this at the START of any "why is X wrong / what is the root cause" investigation, then get_playbook the best-matching one and FOLLOW it.

get_playbook:
  description: >-
    Fetch a root-cause playbook by id (from list_playbooks) — a step-by-step method that sequences the data tools. Load the matching playbook before investigating, then follow its steps in order.
  params:
    id: >-
      playbook id, e.g. root-cause, latency, errors-sla, saturation, middleware-remote, k8s, mesh
