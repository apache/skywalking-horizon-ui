# LLM-facing tool manifest for the `context` skill: each tool's description +
# per-param hints the model reads to pick and call the tool. Edit the prompt text
# HERE, not in skill/context/tools.ts (which reads these via toolPrompt). These
# strings are part of the provider prompt-cache prefix — keep them byte-stable.

list_layers:
  description: >-
    List the observability layers OAP reports (GENERAL, MESH, K8S_SERVICE, …) with each layer's display alias and service count. Start here to orient; then call kb_layer_capabilities(layer) for what a layer offers — its vocabulary, components, trace source, and relation metric legends — before reading its metrics.

list_services:
  description: >-
    List services with their id, name AND layer. Pass a layer to list that layer only, OR OMIT the layer to search ACROSS ALL layers by name — do that (with a keyword) to find a service when you do not know its layer, instead of guessing. Use the returned id as serviceId for drilling and the layer for kb_browse_catalog / rendering. A service that lives in several layers appears once per layer. Capped at 100 rows (truncated:true when more) — narrow with keyword.
  params:
    layer: >-
      OAP layer key (e.g. GENERAL); OMIT to search every layer by name
    keyword: >-
      case-insensitive service-name filter (recommended when no layer is given)
