# LLM-facing tool manifest for the `telemetry` skill: each tool's description +
# per-param hints the model reads to pick and call the tool. Edit the prompt text
# HERE, not in skill/telemetry/tools.ts (which reads these via toolPrompt). These
# strings are part of the provider prompt-cache prefix — keep them byte-stable.

list_alarms:
  description: >-
    List recently firing alarms — SkyWalking's health signal. Start here for 'what is unhealthy / abnormal?': each alarm names the alarmed entity, scope, and the rule message. Active (unrecovered) alarms are listed first. Then drill into the alarmed entity's metrics to explain the anomaly. Optionally filter by layer or a keyword.
  params:
    layer: >-
      OAP layer key filter, e.g. GENERAL
    keyword: >-
      alarm-name / entity keyword filter
