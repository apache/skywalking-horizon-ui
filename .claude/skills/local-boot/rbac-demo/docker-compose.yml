# A throwaway OAP with services in TWO service groups of one layer, so layer
# and group grants can be seen side by side. Images are the ones the e2e
# fixture pins (test/e2e/script/env); `up.sh` exports them from that file.
#
#   GENERAL  payments::checkout -> payments::ledger <- risk::scorer
#   SO11Y_OAP  the OAP itself, scraped by the collector (an operate layer)
#
# Host ports are offset so this runs beside the other local environments:
# GraphQL 12820, admin 17138, agent gRPC 11810.

services:
  banyandb:
    image: "ghcr.io/apache/skywalking-banyandb:${SW_BANYANDB_COMMIT}"
    command: standalone --measure-metadata-cache-wait-duration 1m --stream-metadata-cache-wait-duration 1m
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -nz 127.0.0.1 17912"]
      interval: 5s
      timeout: 60s
      retries: 120

  oap:
    image: "ghcr.io/apache/skywalking/oap:${SW_OAP_COMMIT}"
    ports:
      - "12820:12800"
      - "17138:17128"
      - "11810:11800"
    environment:
      SW_HEALTH_CHECKER: default
      SW_STORAGE_BANYANDB_TARGETS: banyandb:17912
      SW_LOG_LAL_FILES: horizon-e2e
    volumes:
      - ../../../../test/e2e/script/docker-compose/lal.yaml:/skywalking/config/lal/horizon-e2e.yaml
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/11800"]
      interval: 5s
      timeout: 60s
      retries: 120
      start_period: 90s
    depends_on:
      banyandb:
        condition: service_healthy

  # Scrapes the OAP's own Prometheus endpoint into the OAP, which files it
  # under SO11Y_OAP — a Platform monitoring layer for the demo.
  otel-collector:
    image: "${SW_OTEL_COLLECTOR_IMAGE}"
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      oap:
        condition: service_healthy

  payments-ledger:
    image: "horizon-e2e-demo-provider:${SW_E2E_SERVICE_COMMIT}"
    pull_policy: never
    environment:
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: oap:11800
      SW_AGENT_NAME: "payments::ledger"
      SW_AGENT_INSTANCE_NAME: ledger-1
      SW_LOGGING_OUTPUT: CONSOLE
      SW_METER_ACTIVE: 'true'
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/9090"]
      interval: 5s
      timeout: 60s
      retries: 120
    depends_on:
      oap:
        condition: service_healthy

  payments-checkout:
    image: "horizon-e2e-demo-consumer:${SW_E2E_SERVICE_COMMIT}"
    pull_policy: never
    environment:
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: oap:11800
      SW_AGENT_NAME: "payments::checkout"
      SW_AGENT_INSTANCE_NAME: checkout-1
      SW_LOGGING_OUTPUT: CONSOLE
      SW_METER_ACTIVE: 'true'
      PROVIDER_URL: http://payments-ledger:9090
    depends_on:
      payments-ledger:
        condition: service_healthy

  # Another group calling into payments: its topology shows payments::ledger
  # as a neighbour, which a risk-only role sees but cannot open.
  risk-scorer:
    image: "horizon-e2e-demo-consumer:${SW_E2E_SERVICE_COMMIT}"
    pull_policy: never
    environment:
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: oap:11800
      SW_AGENT_NAME: "risk::scorer"
      SW_AGENT_INSTANCE_NAME: scorer-1
      SW_LOGGING_OUTPUT: CONSOLE
      SW_METER_ACTIVE: 'true'
      PROVIDER_URL: http://payments-ledger:9090
    depends_on:
      payments-ledger:
        condition: service_healthy

  loadgen:
    image: "alpine:3.22"
    command:
      - sh
      - -c
      - |
        while true; do
          for h in payments-checkout risk-scorer; do
            wget -q -O /dev/null --post-data='{"id":"1","name":"demo"}' --header='Content-Type: application/json' "http://$$h:9092/users" || true
          done
          sleep 2
        done
    depends_on:
      - payments-checkout
      - risk-scorer
